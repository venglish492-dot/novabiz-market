# Builds the REALITY SYSTEM Android app (APK) on GitHub's servers.
# Download it from the run's "Artifacts" section: RealitySystem-android-apk.
name: REALITY SYSTEM – Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'reality-system/**'
      - '.github/workflows/reality-system-apk.yml'

permissions:
  contents: read

concurrency:
  group: reality-system-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: reality-system
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reality-system/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build web app and sync it into the Android project
        run: npm run android:sync

      - name: Build signed APK
        working-directory: reality-system/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "RealitySystem-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: RealitySystem-android-apk
          path: reality-system/RealitySystem-${{ github.run_number }}.apk
          retention-days: 90
          if-no-files-found: error
