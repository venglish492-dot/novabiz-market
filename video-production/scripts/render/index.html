<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>VektorLab reel renderer</title>
    <style>
      @font-face { font-family: 'Geist'; src: url(/video-production/assets/fonts/Geist-Latin-Variable.woff2) format('woff2'); font-weight: 100 900; }
      @font-face { font-family: 'Geist Mono'; src: url(/video-production/assets/fonts/GeistMono-Latin-Variable.woff2) format('woff2'); font-weight: 100 900; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #07080a; }
      #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #gl { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      #ui { position: absolute; inset: 0; pointer-events: none; color: #eef0f5; font-family: 'Geist', sans-serif; perspective: 1400px; perspective-origin: 50% 45%; }
      .abs { position: absolute; }
      .h { position: absolute; left: 0; right: 0; text-align: center; font-weight: 760; font-size: 138px; line-height: 0.9; letter-spacing: -0.045em; text-transform: uppercase; white-space: nowrap; transform-style: preserve-3d; }
      .mask { display: block; overflow: hidden; padding: 0.07em 0 0.05em; }
      .mask > span { display: inline-block; will-change: transform; }
      .label { font-family: 'Geist Mono', monospace; font-weight: 500; font-size: 27px; letter-spacing: 0.34em; text-transform: uppercase; color: #b9bfcc; white-space: nowrap; display: flex; align-items: center; gap: 22px; }
      .dot { width: 12px; height: 12px; border-radius: 50%; background: #8b9cff; box-shadow: 0 0 18px #8b9cff; flex: none; }
      .rule { height: 2px; background: linear-gradient(90deg, #8b9cff, rgba(139,156,255,0)); transform-origin: left center; }
      .chip { display: flex; align-items: center; gap: 30px; padding: 24px 42px 24px 28px; border-radius: 30px; border: 2px solid #2a2e37; background: rgba(17,20,25,0.92); white-space: nowrap; }
      .chip b { font-family: 'Geist Mono', monospace; font-weight: 600; font-size: 60px; letter-spacing: 0.06em; color: #eef0f5; padding: 10px 16px; border: 2px solid #3a3f4b; border-radius: 14px; }
      .chip span { font-size: 58px; font-weight: 500; color: #a7adbb; letter-spacing: -0.01em; }
      .wordmark { font-size: 84px; letter-spacing: 0.22em; white-space: nowrap; text-align: center; }
      .wordmark .v { font-weight: 600; color: #eef0f5; }
      .wordmark .l { font-weight: 380; color: #a7adbb; }
      .url { font-family: 'Geist Mono', monospace; font-size: 40px; letter-spacing: 0.08em; color: #a9b6ff; text-align: center; }
      .cta { display: inline-flex; align-items: center; gap: 18px; padding: 26px 44px; border-radius: 999px; background: #eef0f5; color: #07080a; font-weight: 640; font-size: 36px; letter-spacing: 0.08em; white-space: nowrap; }
      .tiny { font-family: 'Geist Mono', monospace; font-size: 20px; letter-spacing: 0.28em; text-transform: uppercase; color: #6d7380; white-space: nowrap; }
    </style>
    <script type="importmap">
      { "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
    </script>
  </head>
  <body>
    <div id="stage"><canvas id="gl" width="1080" height="1920"></canvas><div id="ui"></div></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
